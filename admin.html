<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة الورشة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* تخصيصات إضافية لصفحة الإدارة بنفس الستايل المظلم */
        .admin-header { background: rgba(15, 23, 42, 0.95); padding: 20px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: rgba(30, 41, 59, 0.7); border: 1px solid var(--border-color); padding: 20px; border-radius: 15px; text-align: center; }
        .stat-card h3 { font-size: 2rem; color: var(--accent-color); }
        .admin-table-container { background: rgba(30, 41, 59, 0.7); border: 1px solid var(--border-color); border-radius: 15px; padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border-color); }
        th { color: var(--accent-color); font-family: var(--font-heading); }
        tr:hover { background: rgba(255,255,255,0.02); }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .badge.pending { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid #f59e0b; }
        .badge.confirmed { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }
        .action-btns { display: flex; gap: 10px; }
        .btn-sm { padding: 5px 10px; font-size: 0.9rem; border-radius: 5px; }
        .btn-wa { background: #25D366; color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px; display: inline-flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="container nav-content">
            <div class="logo"><span class="highlight">W</span>ork<span class="highlight">S</span>hop Admin</div>
            <div class="nav-links">
                <button class="btn-outline" onclick="exportToCSV()"><i class="fa-solid fa-file-excel"></i> تصدير كشف الحضور</button>
                <a href="index.html" class="btn-primary">العودة للموقع</a>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <p>إجمالي المسجلين</p>
                <h3 id="statTotal">0</h3>
            </div>
            <div class="stat-card">
                <p>مؤكد الدفع</p>
                <h3 id="statConfirmed" style="color: #10b981;">0</h3>
            </div>
            <div class="stat-card">
                <p>قيد المراجعة / دفع نقدي</p>
                <h3 id="statPending" style="color: #f59e0b;">0</h3>
            </div>
        </div>

        <!-- جدول الحضور -->
        <div class="admin-table-container">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                <h2>قائمة المتدربين المسجلين</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>رقم</th>
                        <th>الاسم</th>
                        <th>رقم الواتساب</th>
                        <th>طريقة الدفع</th>
                        <th>الإيصال</th>
                        <th>الحالة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="attendeesTableBody">
                    <tr><td colspan="7" style="text-align:center;">جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
